version: '3.8'

services:

  mariadb-db:
    image: mariadb:10.11
    container_name: mi_mariadb_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_segura}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mascotas_perdidas}
      MYSQL_USER: ${MYSQL_USER:-mp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mp_password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  spring-backend:
    build: ./backend
    container_name: mi_spring_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mariadb://mariadb-db:3306/mascotas_perdidas?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Madrid}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-mp_user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-mp_password}
      - SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--Xmx400m -Xms200m}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:4200,https://mascotaperdida.vercel.app}
      - APP_UPLOAD_DIR=${APP_UPLOAD_DIR:-/app/uploads}
      - APP_PUBLIC_API_URL=${APP_PUBLIC_API_URL:-}
    depends_on:
      mariadb-db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

volumes:
  mariadb_data:
  backend_uploads:
